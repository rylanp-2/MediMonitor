<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raspberry Pi Frontend</title>
    <link
      rel="icon"
      type="image/gif"
      href="https://c.tenor.com/sy9I8BjGEbcAAAAi/pepe-lightsaber.gif"
    />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="theme adaptive">
    <header class="title-bar">
      <h1>MediMonitor</h1>
      <p>Riley Tinkl, Rylan Peebles, Theo Patrick</p>
    </header>

    <main class="container">
      <section class="upper-left-column">
        <h2>Device Configuration</h2>
        <form class="form-area fill-height">
          <div class="form-group">
            <label for="temp-upper">Upper temperature limit:</label>
            <input
              type="number"
              id="number-input"
              name="temp-upper"
              min="-30"
              max="30"
              value="4"
              placeholder="&#8451;"
              required
            />
            <span class="validity"></span>
          </div>
          <div class="form-group">
            <label for="temp-lower">Lower temparature limit:</label>
            <input
              type="number"
              id="number-input"
              name="temp-lower"
              min="-30"
              max="30"
              value="0"
              placeholder="°C"
              required
            />
            <span class="validity"></span>
          </div>
          <input
            type="submit"
            id="button"
            value="Confirm"
            style="margin-top: 8px"
          />
        </form>
      </section>

      <section class="lower-left-column">
        <h2>Status History</h2>
        <section class="form-area fill-height scroll-y">
          <p>Time elapsed in each state: ie 10hr good, 5min warn, etc etc</p>
          <br />
          <p>loreum</p>
          <br />
          <p>ipsum</p>
          <br />
          <p>dolor</p>
          <p class="bottom-hover">scroll to view content</p>
        </section>
      </section>

      <section class="right-column">
        <h2>Current Status</h2>
        <div class="status">
          <h3>(status)</h3>
        </div>
        <h3>For:</h3>
      </section>
      <footer class="footer">
        <p>Team 9, ENGR 120, 2025</p>
      </footer>
    </main>
  </body>
</html>
