<!DOCTYPE html>
<html lang="en">
<head>
    <meta name = "viewport" content = "width = device - width, initial - scale = 1.0">
    <title>Raspberry Pi Frontend</title>
    <link rel="icon" type="image/gif" href="https://c.tenor.com/sy9I8BjGEbcAAAAi/pepe-lightsaber.gif" />

    <style>
        :root
        {
            --global-margin: 10px;
            position: relative;
        }

        body
        {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        h1
        {
            line-height: 25px;
        }

        h2
        {
            line-height: 17px;
        }

        .title-bar
        {
            text-align: center;
            padding: 15px;
            border: 3px solid var(--background-light);
            border-radius: 5px;
            transition: border-color 200ms ease;
            background: var(--background-light);
        }
        .title-bar:hover
        {
            border-color: var(--accent);
        }

        /* Colour Theming */
        .theme
        {
            background: #232323;
            --background-light: #323232;
            --button: #646464;
            color: #FBFBFD;
            --accent: #305AEE;
            --highlight-text: #FBFBFD;
        }

        /* Changes theme to light if the browser is set to light mode */
        @media (prefers-color-scheme: light)
        {
            .theme.adaptive
            {
                background: #EEEFF0;
                --background-light: #FEFFFF;
                --button: #DDDFE1;
                color: #232323;
                --accent: #305AEE;
                --highlight-text: #FBFBFD;
            }
        }

    </style>
</head>
<body class="theme adaptive">
    <header class="title-bar">
        <h1>Placeholder Text</h1>
        <p>Riley Tinkl, Rylan Peebles, Theo Patrick</p>
    </header>
</body>
