<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raspberry Pi Frontend</title>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico" />
    <link rel="stylesheet" href="../static/style.css" />
    <script src="../static/script.js" defer></script>
  </head>

  <body class="theme adaptive">
    <main class="container">
      <header class="title-bar">
        <h1>MediMonitor</h1>
        <p>Riley Tinkl, Rylan Peebles, Theo Patrick</p>
        <noscript style="color: var(--negative)">
          You need to enable JavaScript to run this app.
        </noscript>
      </header>
      <section class="upper-left-column">
        <h2>Device Configuration</h2>
        <form class="form-area fill-height">
          <div class="form-group">
            <label for="temp-upper">Upper temperature limit:</label>
            <input
              type="number"
              id="temp-input-high"
              name="temp-upper"
              min="-30"
              max="30"
              value="8"
              placeholder="&#8451;"
              required
            />
            <span class="validity"></span>
          </div>
          <div class="form-group">
            <label for="temp-lower">Lower temperature limit:</label>
            <input
              type="number"
              id="temp-input-low"
              name="temp-lower"
              min="-30"
              max="30"
              value="4"
              placeholder="°C"
              required
            />
            <span class="validity"></span>
          </div>
          <!-- Having the actual unicode character (°C), and html character (&#8451;) for some reason allows chrome to render properly. lord knows why -->
          <input
            type="submit"
            id="button"
            value="Confirm"
            style="margin-top: 8px"
          />
        </form>
      </section>

      <section class="lower-left-column">
        <h2>Status History</h2>
        <section
          class="form-area fill-height scroll-y"
          style="padding-bottom: 0px"
        >
          <pre id="history">Placeholder</pre>
          <small class="bottom-hover">scroll to view content</small>
        </section>
      </section>

      <section class="right-column">
        <h2 style="margin-bottom: 0px">Current Status</h2>
        <section class="status-area">
          <div class="status-group">
            <h3>
              <span class="stat-warn status" id="stat-temp-icon"></span>
              Temperature:
              <span class="status-temperature" id="status-temperature"></span>
            </h3>
          </div>
          <div class="status-group">
            <h3>
              <span class="stat-warn status" id="stat-hum-icon"></span>
              Humidity:
              <span class="status-humidity" id="status-humidity"></span>
            </h3>
          </div>
        </section>
        <section class="debug-container fill-height">
          <section class="form-area debug scroll-y fill-height">
            <p id="not-connected">
              No websocket connection to the Pi, will retry every 2 seconds.
            </p>
            <p id="t1" />
            <p id="t2" />
            <p id="t3" />
            <p id="at" />
            <p id="ut" />
          </section>
        </section>
        <small
          class="form-area form-group"
          style="margin-bottom: auto; color: var(--inactive); margin-top: 8px"
        >
          <input type="checkbox" id="debug-toggle" name="debug-toggle" />
          <label for="debug-toggle">Debug Toggle</label>
          <input
            type="button"
            id="stop-server"
            name="stop-server"
            value="Stop Server"
          />
        </small>
      </section>
      <footer class="footer">
        <p>Team 9, ENGR 120, 2025</p>
      </footer>
    </main>
  </body>
</html>
